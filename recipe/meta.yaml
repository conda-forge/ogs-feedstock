{% set commit = "3814f0097ca199d43ade2e25654c37abab0f7a9b" %}
{% set version = "6.5.9" %}
# {% set commit = "3814f0097ca199d43ade2e25654c37abab0f7a9b" %}

package:
  name: ogs
  version: {{ version }}

source:
  url: https://github.com/ufz/ogs/archive/refs/tags/{{ version }}.tar.gz
  # url: https://gitlab.opengeosys.org/ogs/ogs/-/archive/{{ commit }}/ogs-{{ commit }}.tar.gz
  sha256: ab7a369066359ee5742c76077fb226ec51501ba1ce69a32f17ca5523f536b53a

build:
  number: 0
  skip: true  # [win]
  ignore_run_exports:
    - libboost-python
    - exprtk
    - metis
    - libzlib

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake
    - ninja
    - libgomp                                # [linux]
    - llvm-openmp                            # [osx]
    - make                                   # [linux]
    - tbb-devel
  host:
    - eigen
    - exprtk
    - hdf5
    - libboost-python-devel
    - libxml2
    - metis
    - nlohmann_json
    - pybind11
    - python
    - range-v3
    # - tclap >=1.4.0rc2  # downloaded in build.sh
    - vtk >=9.3.0
    - zlib
    - mfront 5.1                           # [linux]
    - mgis 3.1                             # [linux]
  run:
    - tetgen
    - python
    # Python 3.14 no longer propagates this shared library as a direct run requirement.
    - libpython  # [not win]
    - mfront 5.1                           # [linux]
    - mgis 3.1                             # [linux]
    - tbb
    # Hidden OgsXdmfCore dependency?
    - libtiff

test:
  commands:
    - ogs --version

about:
  home: http://www.opengeosys.org/
  summary: OpenGeoSys (OGS) THMC simulator.
  description: |
    OpenGeoSys (OGS) is a scientific open source project for the development
    of numerical methods for the simulation of thermo-hydro-mechanical-
    chemical (THMC) processes in porous and fractured media.
  license: BSD-3-Clause
  license_family: BSD
  license_file:
    - LICENSE.txt
    - scripts/cmake/json-cmake/LICENSE
    - third_party_licenses.txt
  doc_url: https://www.opengeosys.org/docs
  dev_url: https://gitlab.opengeosys.org/ogs/ogs

extra:
  recipe-maintainers:
    - bilke
